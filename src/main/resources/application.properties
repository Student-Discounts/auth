spring.application.name=sd-auth

spring.datasource.url=${SD_AUTH_DB_URL:jdbc:postgresql://localhost:5432/sd-auth}
spring.datasource.username=${SD_AUTH_DB_USER:sd_auth_user}
spring.datasource.password=${SD_AUTH_DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схему создаёт Flyway (db/migration), Hibernate только сверяет с ней сущности.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Контракт токена: docs/design/RBAC.md, раздел 5.
sd.auth.jwt.issuer=${SD_AUTH_ISSUER:http://localhost:8080}
sd.auth.jwt.audience=student-discounts-api
sd.auth.jwt.access-token-ttl=5m
# Без этих ключей при старте генерируется временная пара (только для разработки):
# sd.auth.jwt.private-key=file:/run/secrets/jwt-private.pem
# sd.auth.jwt.public-key=file:/run/secrets/jwt-public.pem
sd.auth.session.refresh-token-ttl=30d
sd.auth.cors.allowed-origins=${SD_AUTH_CORS_ORIGINS:http://localhost:5173}
